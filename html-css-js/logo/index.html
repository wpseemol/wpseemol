<!DOCTYPE html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta
               name="viewport"
               content="width=device-width, initial-scale=1.0"
          />
          <title>Logo Animation</title>
          <style>
               @keyframes float {
                    0% {
                         transform: translateY(0);
                    }
                    50% {
                         transform: translateY(-5px);
                    }
                    100% {
                         transform: translateY(0);
                    }
               }

               @keyframes blink {
                    0%,
                    100% {
                         opacity: 1;
                    }
                    50% {
                         opacity: 0;
                    }
               }
          </style>
     </head>
     <body>
          <div
               class="logo"
               style="
                    display: flex;
                    align-items: center;
                    font-family: monospace;
                    font-weight: bold;
                    font-size: 1.5rem;
                    color: #fff;
                    background-color: #1a1a1a;
                    padding: 10px 20px;
                    border-radius: 10px;
                    animation: float 3s ease-in-out infinite;
               "
          >
               <div
                    style="
                         display: flex;
                         flex-direction: column;
                         align-items: center;
                         margin-right: 10px;
                    "
               >
                    <span style="font-size: 1.4rem">wp</span>
                    <span
                         style="
                              margin-top: -10px;
                              font-size: 1rem;
                              color: lime;
                              animation: blink 1.5s step-start infinite;
                         "
                    >
                         >_
                    </span>
               </div>
               <p style="margin: 0; font-size: 1.2rem">Seemol</p>
          </div>
     </body>
</html>
